// ai-platform 的 gRPC 契约（网关 → AI，内网调用）。
//
// ============================================================================
// 这是**契约真源**（接缝 J5），两侧都从这一个文件生成代码：
//   - Go 侧：`api/aiplatform/v1/*.pb.go`（网关的 client）
//   - Python 侧：`app/grpc/aiplatform/v1/*_pb2*.py`（AI 的 server）
// 字段名/类型/必填性一旦漂移，两侧的字段级快照测试会直接失败（AC-ORCH-02）。
//
// 为什么真源放在 `ai-platform-go/proto/` 而不是父仓库根：
//   网关是这份契约的所有者（docs/04 是网关的 SRS，AI 侧按其实现），
//   放在网关模块内让「改契约 → 重新生成 → 编译」在同一个模块里完成，
//   不依赖模块外的相对路径。AI 侧的生成脚本显式指向这个文件（见其 tools/）。
//
// 为什么**只**定义 gRPC，不写 `option (google.api.http)`：
//   网关对外是 Gin HTTP/SSE，**不打算**用 kratos 的 HTTP 注解 —— 带上它会让这份
//   契约多依赖 `google/api/annotations.proto`（要额外维护 third_party/），
//   而对外 HTTP 契约的真源是 `docs/02`/`docs/03` 与 Pydantic 模型（OpenAPI）。
//   一份契约只管一个方向，两边都清楚「谁是真源」。
//
// 传输分工（docs/08-§7 的架构决策）：
//   - `Chat` / `ChatStream` 走 gRPC（本文件，M3 落 `Chat`、M4 落 `ChatStream`）；
//   - KB / 文档 / 任务 / 上下文摘要等**纯透传**接口走 HTTP（docs/04-§7）。
// ============================================================================

syntax = "proto3";

package aiplatform.v1;

option go_package = "github.com/YunfeiSHU/ai-assistant/ai-platform-go/api/aiplatform/v1;aiplatformv1";

// AiError 是 AI 侧的错误信封，经 gRPC status details 原样回传（接缝 J2）。
//
// 为什么不是直接靠 gRPC 的状态码：客户端是按 `error.code` 分支的，而多个应用
// 错误码会共用同一个 gRPC 规范码（`UPSTREAM_LLM_ERROR` / `OVERLOADED` 都是
// UNAVAILABLE，`CONTEXT_TOO_LONG` / `QUERY_EMPTY` 都是 INVALID_ARGUMENT）。
// 只靠规范码会让「上下文超限」与「提问为空」在客户端看起来一样。
//
// 为什么 `details` 是 JSON **字符串**而不是 `map<string,string>`：契约里的
// `details` 可以嵌套（`fields` 是数组、`hint` 是对象），展开成扁平 map 会丢结构，
// 而 J2 要求**原样透传**。字符串承载是这里唯一无损的选择。
//
// 这个信封挂在 `google.rpc.Status.details` 里（一个 `Any`），随
// `grpc-status-details-bin` trailer 传输 —— 与 gRPC 生态一致，
// 且 Go 侧 `status.Details()` 能直接解出来。
message AiError {
  // 应用错误码（`INVALID_ARGUMENT` / `CONTEXT_TOO_LONG` / `OVERLOADED` …）。
  string code = 1;
  // 面向用户的文案（zh-CN）。
  string message = 2;
  // AI 侧希望映射到的 HTTP 状态码：网关直接用它的另一个原因是
  // 「上游说了算」—— 网关自己按码猜状态码会在两侧码表不同步时悄悄改语义。
  int32 http_status = 3;
  bool retryable = 4;
  // AI 侧的 trace id（接缝 J3）：网关 MUST 原样保留，否则排障时链路断开。
  string trace_id = 5;
  // `error.details` 的原始 JSON，空表示没有。
  string details_json = 6;
}

// AiPlatform 是 AI 侧的内网服务。
service AiPlatform {
  // Chat 一次完整的非流式对话（docs/04-§2.2 的 `POST /chat`）。
  //
  // 与 HTTP `POST /chat` **行为等价**（含 `use_tools=true` 时转 Agent 流程），
  // 两侧的差别只有传输：HTTP 用 `Authorization` 头，gRPC 用同名 metadata。
  //
  // MUST NOT 重试（docs/04-§3.4）：会重复计费、重复落上下文。
  rpc Chat(ChatRequest) returns (ChatResponse);

  // ChatStream 一次流式对话（docs/04-§2.2 的 `POST /chat/stream` 的等价物）。
  //
  // 事件序列（docs/04-§2.3）：`meta` → `reference`* → (`tool_call`/`tool_result`)*
  // → `token`* → `usage` → `done`；出错时以 `error` 收尾且**不再有** `usage`/`done`。
  //
  // 与 HTTP SSE 版本的差别只有传输：HTTP 版把每个事件序列化成
  // `event: <名>\ndata: <JSON>\n\n`，这里把同一份数据放进 `ChatEvent` 的 oneof。
  //
  // MUST NOT 重试（同上）。客户端取消（断连）时 AI 侧 MUST 停止上游 LLM 调用
  // （REQ-ORCH-004 / 其 SRS 的 REQ-CHAT-006）。
  rpc ChatStream(ChatRequest) returns (stream ChatEvent);
}

// ChatMessage 是传给 AI 的一条历史消息。
//
// 只在 `use_memory = false` 时才有值（接缝 J4）：`use_memory = true` 时网关
// MUST NOT 传 history —— AI 从自己的 Redis 取上下文，传了会**重复注入**。
message ChatMessage {
  // system / user / assistant / tool
  string role = 1;
  string content = 2;
}

// ChatRequest 是一次非流式对话的输入。
//
// 字段与 `ai-platform/app/schemas/chat.py::ChatRequest` 逐条对应，**除了**：
//   - 不含 `stream`：gRPC 方法本身就是非流式的，带上它只会出现
//     「HTTP 路径传 true 报 400、gRPC 路径传 true 被忽略」这种行为分叉；
//   - 不含 `user_id`：用户身份来自 `authorization` metadata，由 AI 侧自行验签
//     （接缝 J1/J9）。网关 MUST NOT 自报 user_id 让 AI 信任（防伪造，docs/04-§3.2）。
message ChatRequest {
  // 用户提问，去空白后 1..8000 字符。
  string query = 1;

  // 会话 ID（`cv_` + ULID）。网关是**唯一生成者**（接缝 J4），MUST 总是填。
  optional string conversation_id = 2;

  // use_memory = false 时使用的历史，最多 200 条。
  repeated ChatMessage history = 3;

  bool use_rag = 4;
  // 知识库过滤，最多 10 个（`kb_` + ULID）。
  repeated string kb_ids = 5;
  bool use_memory = 6;
  bool use_tools = 7;

  // 覆盖默认模型；须在 AI 侧白名单内。
  optional string model = 8;
  optional double temperature = 9;
  optional int32 top_k = 10;
  optional int32 rerank_top_n = 11;
  optional double score_threshold = 12;

  // 埋点透传，不进 Prompt；键值各 ≤ 64 字符。
  map<string, string> metadata = 13;
}

// ChatResponse 是一次非流式对话的输出。
//
// 字段与 `chat.py::ChatResponse` 逐条对应 —— **包括 `answer` 这个名字**：
// 契约里回答正文就叫 `answer`，网关落库时映射到消息台账的 `content`。
// 生成代码时若顺手改成 `content`，两侧的字段快照测试会立刻失败。
message ChatResponse {
  // 完整回答（Markdown）。
  string answer = 1;

  // AI 侧回的会话 ID。网关 MUST 校验它与请求一致；不一致时以网关的为准并告警
  // （接缝 J4 / AC-ORCH-07）。
  optional string conversation_id = 2;

  // 本条回答的 ID（AI 侧生成，用于排障对齐；网关自己的消息 ID 另生成）。
  string message_id = 3;

  repeated Reference references = 4;
  repeated ToolCallTrace tool_calls = 5;
  Usage usage = 6;

  // stop / length / max_steps
  string finish_reason = 7;
  // **实际**使用的上游模型名（不是请求里那个）。
  string model = 8;

  bool degraded = 9;
  // rag_unavailable / memory_unavailable / rerank_skipped / mcp_unavailable / summary_failed
  repeated string degraded_reasons = 10;

  int64 elapsed_ms = 11;
}

// Reference 是回答里的引用来源（`docs/06` §6）。
message Reference {
  // 与正文里的 [n] 一一对应。
  int32 index = 1;
  string chunk_id = 2;
  string doc_id = 3;
  string kb_id = 4;
  string doc_name = 5;
  optional int32 page = 6;
  optional string heading_path = 7;
  double score = 8;
  string snippet = 9;
  string content_sha256 = 10;
}

// ToolCallTrace 是一条工具调用轨迹。
message ToolCallTrace {
  string call_id = 1;
  string name = 2;
  // 实际执行参数。proto3 没有「任意 JSON」类型，用 JSON **字符串**承载
  // （与 docs/04-§2.3 的事件映射表同口径）。网关落库时按字节存进
  // `tool_calls` 列，不解析 —— schema 由 AI 侧定义。
  string arguments_json = 3;
  // ok / error / timeout / forbidden
  string status = 4;
  string summary = 5;
  int64 elapsed_ms = 6;
}

// Usage 是本次对话的 token 用量。
message Usage {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
}

// ============================================================================
// 流式事件（docs/04-§2.3 的事件映射表）
// ============================================================================
//
// 为什么是「一个 oneof + 每个事件一个小 message」而不是「一个 `bytes` 原样搬运」：
// 网关必须**看懂**其中几类事件才落得了库 —— `token` 要拼接正文、`usage` 要交给配额、
// `done` 决定落库状态、`tool_call`/`tool_result` 要按 `call_id` 配成一条轨迹。
// 把它们留在字节里，等于让网关再写一个 JSON 解析器，且 AI 侧改字段名不会被任何
// 编译期检查发现。
//
// 代价（必须写明，而不是假装没有）：**事件名序列与顺序完全一致，但 `data` 的字节
// 不是逐字节相同** —— 网关会用 Go 重新序列化。docs/04-§4.2 那条「逐字节相同」是
// HTTP/SSE 默认传输下的要求；走 gRPC 时按 §2.1 的 gRPC 前置条件取
// `AC-ORCH-03` 的口径（事件名与顺序一致、`data` 语义一致）。
//
// 为什么保留 `StreamUnknown` 这个逃逸口：docs/04-§4.1 要求「未知 `event:` 类型
// MUST 透传，MUST NOT 丢弃」。带 oneof 的契约天然只认识自己定义过的事件，
// 一旦 AI 侧新增一类事件，没有这个分支就只能静默丢弃 —— 而「静默丢弃」正是
// 该条需求要防的事。

// ChatEvent 是一条流式事件（对应 HTTP SSE 的一帧）。
message ChatEvent {
  oneof event {
    StreamMeta meta = 1;
    StreamReferences reference = 2;
    StreamToken token = 3;
    StreamToolCall tool_call = 4;
    StreamToolResult tool_result = 5;
    // 复用非流式的 `Usage`：字段与 HTTP 版 `usage` 事件的 data 完全一致，
    // 再造一个同字段的 message 只会多一处要同步的地方。
    Usage usage = 6;
    StreamError error = 7;
    StreamDone done = 8;
    StreamUnknown unknown = 9;
  }
}

// StreamMeta 是首帧（对应 SSE 的 `event: meta`）。
message StreamMeta {
  // AI 侧回显的会话 ID。网关 MUST 校验它与请求一致（接缝 J4 / AC-ORCH-07）。
  optional string conversation_id = 1;
  // AI 侧生成本条回答的 ID（网关自己的消息 ID 另生成，两者都记下来便于排障对齐）。
  string message_id = 2;
  // **实际**使用的模型名。
  string model = 3;
  // RFC3339 毫秒 UTC。
  string created_at = 4;
  // 本轮是否发生降级（RAG/记忆）。
  bool degraded = 5;
  // 降级原因列表（RAG/记忆 各自的降级理由）。
  //
  // 这里比 HTTP 版 `meta` 多一个字段，是**有意**的：docs/04-§2.3 的映射表只列了
  // `degraded` 布尔，而 docs/04-§9 要求「AI 返回 degraded=true 时在 assistant 消息的
  // `degraded_reasons` 中保留」—— 只传布尔值满足不了那一条。AI 侧本来就有
  // `prepared.degraded_reasons`，把原因一起带过来是零成本的。
  repeated string degraded_reasons = 6;
}

// StreamReferences 是引用帧（对应 SSE 的 `event: reference`）。
//
// 一次给出**本轮全部**引用（而不是增量）：契约要求引用先于首个 token 推送，
// 而正文里的 `[n]` 需要客户端在拼接时就能查到 `n` 对应的来源。
//
// 本帧**可以出现多次**（Agent 路径在每次 tool_result 之后补发一次，因为新检索到的
// 片段是在那一轮才产生的）。语义是「当前引用集合」而不是「新增引用」，
// 因此消费方 MUST 整体替换、MUST NOT 追加 —— 追加会让同一条引用重复落库，
// 而正文里的 `[1]` 只指向其中一个。
message StreamReferences {
  repeated Reference references = 1;
}

// StreamToken 是正文增量帧（对应 SSE 的 `event: token`）。
message StreamToken {
  // 增量文本。**可能为空串**（上游有时会发空 delta），空串也必须原样透传：
  // 丢弃它会让客户端与服务端的帧数不一致，而 docs/04-§4.1 要求顺序与数量保真。
  string delta = 1;
}

// StreamToolCall 是工具调用开始帧（对应 SSE 的 `event: tool_call`）。
message StreamToolCall {
  string call_id = 1;
  string name = 2;
  // 与 `ToolCallTrace.arguments_json` 同口径：proto3 没有「任意 JSON」类型，
  // 用 JSON 字符串承载，网关按字节存。
  string arguments_json = 3;
}

// StreamToolResult 是工具调用结果帧（对应 SSE 的 `event: tool_result`）。
//
// 与 `StreamToolCall` 靠 `call_id` 配对：网关落库时要拼成一条完整轨迹
// （`docs/03-§4.1` 的 `tool_calls` 数组），只有开始没有结果的调用
// 落库时 `status` 取 `error`（`summary` 说明「未返回结果」）。
message StreamToolResult {
  string call_id = 1;
  string name = 2;
  // ok / error / timeout / forbidden
  string status = 3;
  string summary = 4;
  int64 elapsed_ms = 5;
}

// StreamError 是错误帧（对应 SSE 的 `event: error`）。
//
// 与 `AiError`（错误信封，挂在 `google.rpc.Status.details` 上）**不是一回事**：
// `AiError` 用于「响应头都还没发出」的失败，`StreamError` 用于「流已经开始推、
// 只能靠事件告知」的失败。两者的字段刻意保持同一套（code/message/retryable），
// 客户端可以用同一段分支处理。
message StreamError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

// StreamDone 是结束帧（对应 SSE 的 `event: done`）。
message StreamDone {
  // stop / length / max_steps / canceled
  string finish_reason = 1;
  int64 elapsed_ms = 2;
  // 本轮是否**提前结束**（上游超时/取消），即 `docs/03-§4.1` 的 `status=partial`。
  bool partial = 3;
}

// StreamUnknown 是未识别事件的逃逸口（docs/04-§4.1「未知事件 MUST 透传」）。
message StreamUnknown {
  // 原始 SSE `event:` 名。
  string event = 1;
  // 原始 `data` 的 JSON 字节。网关不解析、不再序列化，原样转发。
  bytes data_json = 2;
}
