apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # 看板上的 traceId 跳转靠它（otel_trace_id 由 Prometheus exemplar / 日志携带）
      tracesToMetrics:
        datasourceUid: prometheus
